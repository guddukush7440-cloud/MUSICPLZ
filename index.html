
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090f">
<title>MUSICPLZ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090f;color:white;font-family:Arial,sans-serif;padding:22px}
header{font-size:27px;font-weight:bold;letter-spacing:2px}
header span{color:#a78bfa}
h2{margin-top:35px}
input{width:100%;padding:15px;border:1px solid #333;border-radius:14px;background:#191923;color:white;font-size:16px}
.card{margin-top:20px;padding:20px;background:#191923;border-radius:18px}
button{background:#a78bfa;color:#09090f;border:0;padding:12px 20px;border-radius:25px;font-weight:bold}
#status{color:#aaa}
</style>
</head>
<body>
<header>MUSIC<span>PLZ</span></header>
<p id="status">Your music, your vibe.</p>
<h2>Search Music</h2>
<input id="search" placeholder="Search your favourite song...">
<div class="card">
<h3>Welcome to MUSICPLZ 🎵</h3>
<p>Discover and enjoy your music.</p>
<button onclick="alert('Music player coming soon!')">PLAY MUSIC</button>
</div>
</body>
</html>
